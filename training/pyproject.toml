[project]
name = "grimml-train"
version = "0.1.0"
description = "Decode, label, feature, train and export grimml combat datasets"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "skl2onnx>=1.16",
    "onnxmltools>=1.12",
    "onnxruntime>=1.17",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grimml-train = "grimml_train.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["grimml_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
