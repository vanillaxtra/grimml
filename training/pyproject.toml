[project]
name = "grimml-train"
version = "0.2.0"
description = "Train, test and publish GrimML combat models, one module at a time"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
bulk = ["pyarrow>=15"]   # --bulk-processed (parquet)
dev = ["pytest>=8"]

[project.scripts]
grimml-train = "grimml_train.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["grimml_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
