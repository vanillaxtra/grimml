seed: 42
# mixed dump: cheat vs legit is inside MARKER records (GML2/3) or sidecars
recordings_dir: E:/recordings
sidecar_dir: E:/recordings
out_dir: out
marker_trim_seconds: 3.0
exclude_grim_features_when_weak_labels: true
workers: 0
shard_size: 4000
keep_unlabeled: true
keep_frames: false
skip_bad_files: true
resume: true
exclude_interrupted: true
exclude_flagged_from_train: true
max_fpr: 0.01
confound_auc_warn: 0.6
allow_probable_negatives: false
# share of a window that must sit inside a trimmed mark segment to get its label
marker_min_overlap: 0.9
# taxonomy.yml for MARKER_KV names and module families (default: sidecar_dir/taxonomy.yml)
taxonomy_path: null
# plugin map snapshots for LOS (default: sidecar_dir/maps)
maps_dir: null
cv_folds: 5
# older windows parquet for grimml-train drift
drift_reference: null
