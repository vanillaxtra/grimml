# Recorder builds before the per-window validity fix OR'd the event bits over the player's whole session, so
# valid_death/respawn/teleport/... were set on almost every window after the first such event. Set this to the UTC
# time the fixed recorder went live (ISO or epoch ms); windows recorded from then on get the hard-validity filter.
# null = no fixed build deployed yet, every file is treated as old. See docs/known-issues.md ("sticky validity bits").
validity_fixed_from: null
