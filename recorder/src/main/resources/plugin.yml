name: grimmlrecorder
version: ${project.version}
main: dev.grimml.GrimMLPlugin
api-version: '1.21'
description: Combat recorder that makes training data for GrimML (not needed to detect)
authors: [grimml]
depend:
  - packetevents
softdepend:
  - GrimAC
  - Geyser-Spigot
  - floodgate
  - LiteBans
# /grimmlrecorder (alias /gmlr) is registered in code through the paper lifecycle command api
permissions:
  grimmlrecorder.admin:
    description: Control the combat recorder
    default: op
