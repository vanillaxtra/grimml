name: grimml
version: ${project.version}
main: dev.grimml.GrimMLPlugin
api-version: '1.21'
description: Combat recording for Grim ML detection (recorder only)
authors: [grimml]
depend:
  - packetevents
softdepend:
  - GrimAC
  - Geyser-Spigot
  - floodgate
  - LiteBans
# /grimml is registered in code through the paper lifecycle command api
permissions:
  grimml.admin:
    description: Control the combat recorder
    default: op
