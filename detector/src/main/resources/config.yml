# GrimML - machine-learning combat checks for Grim Anticheat
# Detects Kill Aura, Aim Assist, Triggerbot, Silent Aim, Instant Lunge and Auto Shield Breaker.
# Beta: the models are trained on a small number of players. Alerts are safe to use; keep punishments off
# until you have checked the alerts on your own server.
# Permissions: grimml.alerts, grimml.alerts.sound, grimml.overlay, grimml.history, grimml.notify, grimml.admin, grimml.bypass, grimml.bypass.<check>, grimml.bypass.telemetry, grimml.label, grimml.telemetry.trusted

# do not change: tells GrimML which settings this file has (a warning on startup means new settings were added)
config-version: 4

# tell the console and players with grimml.update.notify when a new GrimML release is on GitHub
update-checker: true

models:
  # newest models are downloaded from here (checked every few minutes, off the main thread);
  # the copy bundled in the jar is used until then, and if the download fails
  auto-update: true
  manifest-url: "https://raw.githubusercontent.com/vanillaxtra/grimml/main/models/manifest.json"
  check-every-minutes: 15

window:
  # frames per window; must match the recorder's ring-capacity used for training (160 = 8 s)
  frames: 160

scan:
  interval-ms: 2000      # how often windows are scored (the recorder wrote a window every 2 s)
  min-attacks: 2         # windows with fewer attacks are not scored
  min-frames: 40
  fight-gap-ms: 20000    # this long without attacking ends a fight (and it is judged)
  # ML checks judge a fight once per block of windows and once when it ends, as training measures it:
  # flagged when the share of flagged windows in that stretch reaches the model's alert line
  fight-block-windows: 120 # 120 windows = 4 min of fighting (the length of a legit chunk in training)
  fight-min-windows: 20    # shorter stretches (under ~40 s of fighting) are never judged
  # Early alert: flag before the block is full when a fight is clearly over the line (most cheaters in ~20-30 s).
  # Higher z = surer before flagging early (2.0 faster but more false flags, 3.0 tested safe, 0 = only judge blocks)
  early-alert-z: 3.0
  early-alert-min-windows: 10 # at least this many windows (~20 s of fighting) before an early alert
  skip-bedrock: true     # Floodgate players are never scanned

# AimGrid: real mouse rotation is a whole number of sensitivity steps; aim assist adds rotation that is not.
# Each player's step is learned from their own rotation (also outside fights), then a running score adds up
# off-grid rotation while they fight. It alerts when the score reaches alert-score AND the off-grid rotation leans
# toward the opponent (zoom, cinematic camera and odd mice are off-grid in both directions). Players whose rotation
# fits no mouse grid (controllers, cinematic camera) are skipped. Calibrated on recorded fights: legit never
# passed 2.3, aim assist reached 20 within 1.5-6 s once the step was known.
aim-grid:
  enabled: true
  legit-off-rate: 0.01     # expected off-grid share for a legit player (measured 0.0-0.2%)
  cheat-off-rate: 0.10     # off-grid share the test is tuned to catch (measured aim assist 19-26%)
  alert-score: 20.0
  min-toward-bias: 0.05
  alert-cooldown-ms: 15000
  # Per-player baseline, so non-linear mice (Windows "Enhance pointer precision", Raw Accel, custom curves) do not
  # flag: the assist only pulls when there is a target, so rotation OUTSIDE fights shows the player's own off-grid
  # rate. The legit rate above is raised to (that rate x baseline-margin), and fight rotation is only tested once
  # baseline-samples out-of-fight rotation samples exist (~5 s of moving the mouse outside a fight).
  # Replayed on every recording: legit fights alerting 7/30 -> 2/30 (a spear fight and a cinematic-camera stretch).
  # Bot-fight cheat recordings have almost no time outside the fight, so 2 of the 4 aim assist sessions that alerted
  # before never build a baseline there; real players spend time outside fights (UNVERIFIED live).
  baseline-margin: 1.5     # how far above their own rate a fight must be (higher = fewer false flags, slower)
  baseline-max: 0.08       # players whose rotation is more off-grid than this outside fights are skipped
  baseline-samples: 100
  # Moves bigger than this many sensitivity steps per tick are ignored: a tiny error in the learned step grows with
  # the size of the move, and acceleration curves bend fast flicks the most. Assist corrections are small.
  max-steps: 20

# LungeRate: Instant Lunge (Prestige, Grim) swaps to the spear, jabs and swaps back as one macro. A swap-lunge is a
# spear jab within 150 ms of a hotbar swap to the spear. By hand the swap -> jab -> swap back chain takes time:
# ~700 recorded legit swap-lunges (spear-mace duel, a deliberate "as fast as possible" session) were never under
# 345 ms apart; Instant Lunge at 0-0, 20-70 and 30-90 ms delay chained them 100-250 ms apart and alerted in every
# session. Holding the spear and jabbing without swapping never counts, so players who never lunge cannot flag.
lunge-rate:
  enabled: true
  fast-ms: 300             # a gap between swap-lunges under this counts as fast
  min-ms: 75               # gaps under this are packets bunched by lag and do not count
  count: 6                 # fast gaps needed ...
  window-ms: 30000         # ... within this long
  alert-cooldown-ms: 15000 # per check, shared by lunge-rate, lunge-hold and swap-order

# LungeHold: the spear held for exactly one client tick (swap in, jab, swap back on the next tick). By hand this is
# rare (2 of 182 swap-lunges in a legit spear-mace fight); Instant Lunge does it on 34-100% at 0-90 ms delay, however
# slowly the lunges are chained. Needs 1.21.2+ clients (client ticks).
lunge-hold:
  enabled: true
  count: 5                 # one-tick holds ...
  of: 10                   # ... among this many latest swap-lunges

# SwapOrder: a hotbar swap sent after an attack or spear jab in the same client tick. The vanilla client sends hotbar
# changes before attacks inside one tick, so this never happens by hand (0 in ~1400 recorded legit hits and swaps);
# a client that swaps, hits and swaps back inside one tick (any swap macro, any client) does it every time.
# Needs 1.21.2+ clients (client ticks).
swap-order:
  enabled: true
  count: 2                 # same-tick swaps after an attack ...
  window-ms: 60000         # ... within this long

# AxeHold: Auto Shield Breaker swaps to the axe, hits the shield and swaps away on the very next client tick. An axe
# hold is a swap to the axe with at least one hit on a player, ended by the swap away. By hand that swap comes 2+ ticks
# after the hit on 92-97% of fast stuns against a shielding bot (3 sessions, ~220 axe holds, 0 alerts); Prestige Auto
# Shield Breaker does it 1 tick later on 63-98% (6 sessions, every setting, 6-17 alerts each). Grim's shield breaker
# swaps back after 2 ticks, like a fast hand, and is not caught by this. Needs 1.21.2+ clients (client ticks).
# Shares lunge-rate.alert-cooldown-ms.
# OFF BY DEFAULT: strong players in real duels swap away one tick after the hit on 86-95% of stuns, the same as the
# cheat, and were flagged 6-9 times per fight (3 fights). The bot fights above did not show this.
axe-hold:
  enabled: false
  count: 6                 # one-tick swap-outs after an axe hit ...
  of: 10                   # ... among this many latest axe holds

# StunRepeat / SlamRepeat / WebRepeat: every stun (axe swapped in, axe hit, swap to another weapon, follow-up hit),
# stun slam (axe hit, swap to the mace, mace hit) and stun web (axe hit, swap to cobwebs, cobweb placed) is written
# down as the client ticks between its steps. A hand never does the same chain to the tick every time; a macro or a
# cheat with fixed delays does. Needs 1.21.2+ clients (client ticks). Shares lunge-rate.alert-cooldown-ms.
# Recorded fights (~20 legit sessions, 8 cheat sessions):
#  - Stun webs are never repeated by hand: at most 43% of one player's webs had the same timing, 0 alerts.
#  - Stuns are NOT safe: strong players swap and hit in the same tick and swap away the next tick on 86-95% of
#    stuns, exactly like Prestige Auto Shield Breaker (95-98%), so StunRepeat would flag them. Off by default.
#  - Stun slams are chained at the same tick floor as stuns and there are no usable recordings; off by default.
combo-repeat:
  stun: false              # StunRepeat (flags strong legit players, see above)
  slam: false              # SlamRepeat (not calibrated)
  web: true                # WebRepeat
  count: 8                 # combos of one kind with exactly the same timing ...
  of: 10                   # ... among this many latest combos of that kind

alerts:
  # Who sees alerts: players with grimml.alerts (op by default); /grimml alerts turns your own on or off.
  # Players with grimml.alerts.sound also hear the sound below.
  #
  # Placeholders (chat, hover, click, webhook and punishments):
  #   %player% %uuid% %check% (short name, e.g. Kill Aura) %check_name% (e.g. MLKillAura) %description%
  #   %confidence% (0-100) %vl% %verbose% %ping% %version% (client version) %brand% %tps% %grimml_version%
  # Confidence: for ML checks, the model's average cheat score over the fight; for rule checks, the share of the
  # player's recent swaps or hits that matched the cheat's pattern.
  # Colours: & codes, &#rrggbb hex, or MiniMessage tags.
  prefix: "&bGrimML &8»"
  format: "%prefix% &f%player% &7flagged &b%check% &8(&f%confidence%%&8) &7x%vl%"
  # shown when hovering over the alert
  hover:
    - "&b%check% &8(%check_name%)"
    - "&7%description%"
    - ""
    - "&7Confidence: &f%confidence%%"
    - "&7Violations: &f%vl%"
    - "&7Details: &f%verbose%"
    - "&7Ping: &f%ping% ms &8| &7Client: &f%version% %brand%"
    - ""
    - "&eClick to teleport to %player%"
  # run by the staff member who clicks the alert; "" = nothing happens on click
  click-command: "/tp %player%"
  console: true
  sound:
    name: "block.note_block.pling"   # any Minecraft sound id; "" = no sound
    volume: 1.0
    pitch: 1.0
  decay-per-minute: 0.05

# Help improve the checks: share anonymous fight data with the GrimML developers (off until you turn it on).
# Sent every upload-every-minutes: the numbers each fight window was scored on, the model scores and the alerts,
# plus your GrimML, Minecraft and model versions. Never sent: player names, UUIDs, IPs, chat or coordinates.
# Players are a salted hash that only this server can make, so nobody can tell who they are or match them across
# servers. Your server is a random id (plugins/GrimML/telemetry/server-id; delete the folder for a new one).
# Not every fight is sent: all alerted and borderline ones, a matching number of quiet ones and a small random
# sample. Players with grimml.bypass.telemetry are never sent.
telemetry:
  enabled: false
  upload-every-minutes: 60

# Alert history: every alert and punishment is saved to plugins/GrimML/history/<date>.jsonl (one file per day, UTC).
# /grimml history <player> [days] (grimml.history) shows them, even for offline players and after restarts.
history:
  enabled: true
  keep-days: 14            # older days are deleted
  # Staff with grimml.alerts see the alerts they missed when they join: since they last left, at most max-minutes back
  # (this run only: after a restart it goes back max-minutes). Click a line to open that player's history.
  on-join:
    enabled: true
    max-minutes: 60
    max-lines: 5

# Staff overlay: /grimml overlay (grimml.overlay) shows a hologram riding on flagged players' heads, only to you.
# It exists only in your client (no server entity), so it follows the head smoothly and never affects teleports.
# One line per check: red = flagged (an alert in the last keep-minutes), yellow = a fight in progress with flagged
# windows that has not alerted yet.
# MiniMessage tags: <check> <confidence> (0-100) <flagged> <windows> (that fight's windows) <count> (alerts)
overlay:
  enabled: true
  height: 0.55        # blocks above the top of the head (0.55 clears the name tag)
  scale: 0.8
  max-lines: 4
  keep-minutes: 5     # a flagged line stays this long after the player's last alert for that check
  show-watching: true
  see-through: false  # true = readable through walls
  background: "40000000" # ARGB hex; "00000000" = no background
  flagged: "<red><check></red> <white><confidence>%</white> <gray><flagged>/<windows>"
  watching: "<yellow><check></yellow> <white><confidence>%</white> <gray><flagged>/<windows>"
  rule: "<red><check></red> <white><confidence>%</white> <gray>x<count>" # rule checks have no windows

# Discord webhook, laid out exactly like Grim's own (Grim's discord.yml), so GrimML alerts sit next to Grim's.
webhook:
  enabled: true
  url: ""                   # "" = use Grim's webhook url when use-grim-webhook is true
  use-grim-webhook: true
  embed-title: "**GrimML Alert**"
  embed-color: "#00FFFF"
  embed-thumbnail-url: "https://crafthead.net/helm/%uuid%"
  embed-image-url: ""
  embed-footer-text: "GrimML v%grimml_version%"
  embed-footer-url: "https://grim.ac/images/grim.png"
  include-timestamp: true
  include-verbose: true     # adds a "Verbose" field with the confidence and details
  violation-content:
    - "**Player**: `%player%`"
    - "**Check**: %check_name%"
    - "**Violations**: %violations%"
    - "**Client Version**: %version%"
    - "**Brand**: `%brand%`"
    - "**Ping**: %ping%"
    - "**TPS**: %tps%"
  # a second embed every time punishment commands run (kicks, bans, anything in punishments)
  punishments:
    enabled: true
    embed-title: "**GrimML Punishment**"
    embed-color: "#FF0000"
    include-verbose: true
    content:
      - "**Player**: `%player%`"
      - "**Punishment**: %group% at %group_vl% violations"
      - "**Last check**: %check_name% (%confidence%%)"
      - "**Commands**: `%commands%`"
      - "**Client Version**: %version%"
      - "**Ping**: %ping%"

# Console commands when a player reaches a number of violations. One violation = one flagged fight (ML checks) or
# one alert (rule checks). Each group adds up the violations of its checks and loses decay-per-minute of them every
# minute (0.05 = one violation per 20 minutes); leaving and rejoining does not reset them.
# checks: MLKillAura MLAimAssist MLTriggerbot MLSilentAim AimGrid LungeRate LungeHold SwapOrder AxeHold,
#   or short names: Kill Aura, Aim Assist (MLAimAssist + AimGrid), Triggerbot, Silent Aim,
#   Instant Lunge (LungeRate + LungeHold), Swap Macro (SwapOrder), Shield Breaker (AxeHold), or "*" for every check.
# Commands run from the console with the alert placeholders plus %group% and %group_vl%; a leading / is optional.
# Use your ban plugin's commands (tempban needs one, e.g. EssentialsX or LiteBans). Every punishment is posted to the
# webhook (see webhook.punishments). Beta: keep this off until the alerts look right on your server.
punishments:
  enabled: false
  # Wait a random number of seconds in this range before running a punishment, so a cheater cannot tell which hit
  # caught them. The punishment still runs if they leave in the meantime (and is posted to the webhook when it runs).
  # min: 0 and max: 0 = right away. Pending punishments are dropped if the server stops first.
  delay-seconds:
    min: 10
    max: 45
  groups:
    # Instant Lunge and Swap Macro never flagged a legit player in testing
    instant-lunge:
      checks: [Instant Lunge, Swap Macro]
      at-violations:
        3:
          - "kick %player% Unfair advantage (%check%)"
        6:
          - "ban %player% Unfair advantage (%check%)"
    # Shield Breaker has flagged a few very fast legit players, so it waits longer
    shield-breaker:
      checks: [Shield Breaker]
      at-violations:
        4:
          - "kick %player% Unfair advantage (%check%)"
        8:
          - "ban %player% Unfair advantage (%check%)"
    # ML checks: one false flag per fight is possible, so act only on many
    kill-aura:
      checks: [Kill Aura]
      at-violations:
        5:
          - "kick %player% Unfair advantage (%check%)"
    aim:
      checks: [Aim Assist, Triggerbot]
      at-violations:
        6:
          - "kick %player% Unfair advantage (%check%)"
    silent-aim:
      enabled: false
      checks: [Silent Aim]
      decay-per-minute: 0.1
      at-violations:
        8:
          - "kick %player% Unfair advantage (%check%)"
