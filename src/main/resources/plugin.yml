name: grimml
version: ${project.version}
main: dev.grimml.GrimMLPlugin
api-version: '1.21'
folia-supported: true
description: Combat recording for Grim ML detection (recorder, labeling, alert-only scoring)
authors: [grimml]
depend:
  - packetevents
softdepend:
  - GrimAC
  - Geyser-Spigot
  - floodgate
  - LiteBans
# /grimml is registered in code through the paper lifecycle command api
permissions:
  grimml.admin:
    description: Control the combat recorder
    default: op
  grimml.alerts:
    description: Receive alert-only model alerts
    default: op
