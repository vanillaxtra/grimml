# Schema version - bump when keys change; missing keys use defaults.
config-version: 5

# Master kill switch. false = no packet hooks write, writer drains then idles.
enabled: true

# Salt for anonymized player IDs (change on install; do not reuse across public shares).
anonymize-salt: "change-me"

# Rolling pre-buffer and post-attack flush window (combat-only recording).
pre-combat-seconds: 5
post-combat-seconds: 2

# Async writer drain interval.
writer-interval-ms: 2000

# Drop newest combat flushes when the writer queue is this deep (never block).
writer-queue-capacity: 256

# Per-player frame ring size (ticks). 160 ≈ 8s at 20 TPS.
ring-capacity: 160

# Per-player event ring (attacks flags clicks etc).
event-ring-capacity: 128

# Auto-pause recording when average MSPT exceeds this (0 = disabled).
mspt-pause-threshold: 50.0

# How often the grimml-disk thread measures the recordings directory (ms).
safety-check-interval-ms: 5000

# Cap total size of the recordings directory in MiB (0 = unlimited). Auto-pauses when exceeded.
max-disk-mb: 20480

# Relative to plugin data folder.
recordings-dir: recordings

# Folder layout inside recordings-dir: hourly = <day>/<hour>/, daily = <day>/, none = flat.
rotation: hourly

# Move finished day folders (older than after-days) out of recordings-dir on the disk thread.
# dir is absolute or relative to the plugin data folder. Needs rotation hourly or daily.
offload:
  enabled: false
  dir: ""
  after-days: 1

# Header tags written into every window so servers stay separable offline.
server-id: default
mode-kit: unknown
map-id: unknown

# absolute for ffa arenas relative for survival privacy
position-mode: absolute

# Fight snapshot: nearby players included with the attacker and target.
bystander-range: 16
bystander-max: 4

# Main-thread potion/attribute reads per tick (rest wait for their slot).
stagger-players-per-tick: 8

# Auto-label combat bans as SUSPECT (not cheat_confirmed). Backfills last N days for offline join.
ban-labels:
  enabled: true
  backfill-days: 14
  roster-file: roster.csv
  combat-reason-keywords:
    - killaura
    - kill aura
    - aura
    - aimassist
    - aim assist
    - aimbot
    - reach
    - hitbox
    - autoclick
    - auto click
    - triggerbot
    - combat
    - fight
    - crystal
    - totem
    - retotem
    - shield
    - autoblock
    - scaffold
    - mace
    - spear
    - stun
    - jump reset
    - velocity
    - antikb
    - anti kb

# recording-mode: auto  = combat windows for attacker + target + nearby
#                mark-only = .gmlml files only for the marked player, only while /grimml mark is open
recording-mode: auto

# Weak grim-auto labels. never cheat_confirmed. kill switch below.
grim-evidence:
  enabled: true
  queue-capacity: 1024
  labels-file: grim-labels.csv
  review-file: grim-review.csv

# One block snapshot per map-id + world (first combat there) for offline line-of-sight.
# radius = blocks around the fight, height = blocks above and below. /grimml mapsave forces one.
map-snapshot:
  enabled: true
  radius: 48
  height: 24
  dir: maps

# Alert-only model scoring (phase 4). Never punishes. Needs model.onnx + model_meta.json
# from grimml-train export in plugins/grimml/<model-dir>/. Alerts go to grimml.alerts.
inference:
  enabled: false
  model-dir: model
  queue-capacity: 256
  decay: 0.9
  alert-score: 1.5
  alert-cooldown-seconds: 60
  min-frames: 20
