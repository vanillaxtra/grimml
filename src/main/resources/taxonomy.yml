version: 1
clients:
  - vanilla_baseline
  - client_a
  - client_b

# Free-text cheat client names used only for tab-complete on client-name= KV.
# Add any names relevant to your test pool; order and case are preserved.
client-names:
  - meteor
  - vapev4
  - vape_lite
  - liquidbounce
  - wurst
  - aristois
  - sigma
  - rise
  - ares
  - prestige
  - inertia
  - nova
  - doomsday
  

modules:
  aim_assist:
    expected_grim:
      - AimModulo360
      - Reach
    settings:
      strength: [low, mid, high]
      smoothing: float
      fov: int
      speed: float
      randomness: int
      sticky: [true, false]
      only_on_rotate: [true, false]
  killaura:
    expected_grim:
      - Reach
    settings:
      reach: float
      rotations: [snap, smooth, silent]
      switch_delay_ms: int
      humanized: [true, false]
      miss_chance: float
  silent_aim:
    settings:
      continous_tracking: [true, false]

  stun_slam:
    settings:
      swap_delay_ticks: int
      jitter: float
  auto_breach_swap:
    settings: []
  auto_spear:
    settings:
      swap_delay_min: int
      swap_delay_max: int
      swap_back: [true, false]

  auto_pearl_catch:
    settings:
      wind_charge_delay: int
      moving_delay: int
      legit_rotate: [true, false]

  auto_diagonl_pearl_catch:
    settings:
      wind_charge_delay: int
      swap_back: [true, false]
      legit_rotate: [true, false]

  triggerbot:
    settings:
      delay_min_ms: int
      delay_max_ms: int
      miss_chance: float
      cooldown_min_percent: int
      cooldown_max_percent: int
  auto_mace:
    settings:
      horizontal_target_distance: float
      min_fall_distance: float
      stunslam: [true, false]
      silent_aim: [true, false]
      swap_back: [true, false]
  auto_totem:
    settings:
      delay_ms: int
      jitter: float
  jump_reset:
    settings:
      offset_ticks: int
      chance: float
  autoclicker:
    settings:
      cps: float
      pattern: [fixed, jitter, butterfly, burst]
  reach:
    settings:
      extra_blocks: float
  scaffold:
    settings:
      place_delay_ticks: int
  auto_shield:
    settings:
      delay_ticks: int
  attribute_swap:
    settings:
      swap_delay_ticks: int
